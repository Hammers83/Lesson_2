<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZUMBA con Angelo | Accedi o Registrati</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0B0F19">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zumba Angelo">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 
                            lime: '#CCFF00', 
                            cyan: '#00E5FF', 
                            pink: '#FF007F', 
                            dark: '#0B0F19', 
                            card: '#131927', 
                            border: '#202A40' 
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .glass-panel {
            background: rgba(19, 25, 39, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid #202A40;
        }
        .fitness-text-gradient {
            background: linear-gradient(135deg, #00E5FF 0%, #CCFF00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #00E5FF 0%, #CCFF00 100%);
        }
    </style>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen flex flex-col justify-between antialiased">

    <!-- NAVBAR HEADER -->
    <nav class="sticky top-0 z-40 glass-panel border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl btn-gradient flex items-center justify-center">
                    <i class="fa-solid fa-bolt text-black text-xl"></i>
                </div>
                <span class="text-xl font-black uppercase text-white">ZUMBA <span class="fitness-text-gradient">con Angelo</span></span>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 flex flex-col items-center justify-center space-y-6">

        <!-- SCHEDA CORSO 
        <div class="max-w-md w-full glass-panel p-4 rounded-3xl border-l-4 border-l-brand-cyan flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-2xl bg-brand-cyan/20 border border-brand-cyan/40 flex items-center justify-center text-brand-cyan text-xl">
                    <i class="fa-solid fa-music"></i>
                </div>
                <div>
                    <span class="text-[10px] uppercase font-black text-brand-lime tracking-widest">Corso Attivo</span>
                    <h3 class="text-base font-black text-white uppercase">Zumba Fitness</h3>
                    <p class="text-xs text-gray-400">Istruttore: <span class="text-white font-bold">Angelo</span></p>
                </div>
            </div>
            <span class="px-3 py-1 bg-brand-dark border border-brand-border text-brand-cyan text-xs font-black rounded-xl uppercase">
                Lunedì &amp; Mercoledì
            </span>
        </div> -->

        <!-- AUTH CARD FORM -->
        <div class="max-w-md w-full glass-panel p-6 sm:p-8 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="text-center mb-6">
                <h2 id="form-header-title" class="text-2xl font-black uppercase text-white">Accedi</h2>
                <p id="auth-subtitle" class="text-xs text-gray-400 mt-1">Inserisci le tue credenziali per accedere</p>
            </div>

            <div id="login-error-container"></div>

            <form id="auth-form" class="space-y-4">
                <div id="form-fields-container" class="space-y-4">
                    <!-- I campi vengono generati in modo sicuro da auth.js -->
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full py-3.5 btn-gradient text-black font-black uppercase tracking-wider text-xs rounded-xl shadow-lg transition hover:opacity-90 active:scale-95">
                    Entra
                </button>
            </form>

            <div class="mt-6 text-center pt-4 border-t border-brand-border">
                <p id="auth-switch-text" class="text-xs text-gray-400">
                    Non hai un account? 
                    <button type="button" id="btn-toggle-auth" class="text-brand-lime font-bold hover:underline ml-1">Registrati</button>
                </p>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="py-4 text-center text-xs text-gray-500 border-t border-brand-border">
        &copy; ZUMBA con Angelo. Tutti i diritti riservati by Angelo Martelli.
    </footer>

    <!-- JS SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
